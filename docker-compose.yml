services:

  db:
    image: mysql:8.0
    container_name: urtg_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: urganchtransgaz_docs
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  php:
    build:
      context: ./backend
    container_name: urtg_php
    restart: unless-stopped
    volumes:
      - ./.env.docker:/var/www/html/.env:ro
    depends_on:
      - db

  nginx:
    build:
      context: ./frontend
    container_name: urtg_nginx
    restart: unless-stopped
    ports:
      - "8093:80"
    depends_on:
      - php

volumes:
  mysql_data:
