server {
    listen 80;
    server_name hujjat.urtg.uz;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # Gzip siqish
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/vnd.ms-fontobject application/x-font-ttf
               font/opentype image/svg+xml;

    # ===== API — PHP-FPM ga proxy =====
    location /api/ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 120;

        # CORS headerlari (nginx darajasida)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Disposition" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ===== Laravel storage fayllar =====
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 30d;
    }

    # ===== Vue SPA — barcha route lari index.html ga =====
    location / {
        try_files $uri $uri/ /index.html;

        # Static resurslar uchun cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # .htaccess va boshqa yashirin fayllarni bloklash
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
